[package]
name = "agent-message-window"
version = "0.1.0"
edition = "2021"
description = "Sliding message window with paired tool-call protection for LLM context"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MukundaKatta/agent-message-window-rs"
